- name: Standard target and source precedence
  yaml: |
    <<: [{x: 1, y: 1}, {x: 2, z: 2}]
    y: 9
  want: |
    x: 1
    y: 9
    z: 2

- name: Last source overrides target and earlier source
  config: |
    plugin: {merge-key: {conflicts: last}}
  yaml: |
    x: 9
    <<: [{x: 1, a: 1}, {x: 2, b: 2}]
  want: |
    x: 2
    a: 1
    b: 2

- name: Target position does not change first precedence
  yaml: |
    x: 9
    <<: [{x: 1}, {x: 2}]
  want: |
    x: 9

- name: Error on equal valued target overlap
  config: |
    plugin: {merge-key: {conflicts: error}}
  yaml: |
    <<: {x: 1}
    x: 1
  error: conflicting key

- name: Error on source overlap
  config: |
    plugin: {merge-key: {conflicts: error}}
  yaml: |
    <<: [{x: 1}, {x: 2}]
  error: conflicting key

- name: Repeated directives rejected by default
  yaml: |
    <<: {a: 1}
    <<: {b: 2}
  error: already defined

- name: Repeated directives combined
  config: |
    plugin: {merge-key: {multiple: combine}}
  yaml: |
    <<: [{a: 1, x: 1}, {b: 2, x: 2}]
    <<: {c: 3, x: 3}
  want: |
    a: 1
    b: 2
    c: 3
    x: 1

- name: Repeated directives combined with last precedence
  config: |
    plugin: {merge-key: {multiple: combine, conflicts: last}}
  yaml: |
    <<: {a: 1, x: 1}
    <<: {b: 2, x: 2}
  want: |
    a: 1
    b: 2
    x: 2

- name: Repeated directive conflicts rejected
  config: |
    plugin: {merge-key: {multiple: combine, conflicts: error}}
  yaml: |
    <<: {x: 1}
    <<: {x: 2}
  error: conflicting key

- name: Legacy last directive with duplicate checks disabled
  config: |
    unique-keys: false
    plugin: {merge-key: true}
  yaml: |
    <<: {a: 1}
    <<: {b: 2}
  want: |
    b: 2

- name: Explicit error overrides disabled duplicate checks
  config: |
    unique-keys: false
    plugin: {merge-key: {multiple: error}}
  yaml: |
    <<: {a: 1}
    <<: {b: 2}
  error: already defined

- name: Combine leaves ordinary duplicate checking intact
  config: |
    plugin: {merge-key: {multiple: combine}}
  yaml: |
    a: 1
    a: 2
    <<: {b: 3}
  error: already defined

- name: Source ordinary duplicates remain errors
  yaml: |
    <<: {a: 1, a: 2}
  error: already defined

- name: Ordinary duplicates retain legacy last value
  config: |
    unique-keys: false
    plugin: {merge-key: {conflicts: error}}
  yaml: |
    a: 1
    a: 2
    <<: {b: 3}
  want: |
    a: 2
    b: 3

- name: Disabled using false
  config: |
    plugin: {merge-key: false}
  yaml: |
    <<: 3
  want: |
    '<<': 3

- name: Disabled using scalar shorthand
  config: |
    plugin: {merge-key: disable}
  yaml: |
    <<: {a: 1}
  want: |
    '<<': {a: 1}

- name: Disabled using mapping
  config: |
    plugin: {merge-key: {disable: true}}
  yaml: |
    <<: [{a: 1}, {b: 2}]
  want: |
    '<<': [{a: 1}, {b: 2}]

- name: Explicit false disable enables merging
  config: |
    plugin: {merge-key: {disable: false}}
  yaml: |
    <<: {a: 1}
  want: |
    a: 1

- name: Disabled short explicit tag rejected
  config: |
    plugin: {merge-key: false}
  yaml: |
    !!merge '<<': {a: 1}
  error: merge tag is disabled

- name: Disabled long explicit tag rejected
  config: |
    plugin: {merge-key: false}
  yaml: |
    !<tag:yaml.org,2002:merge> <<: {a: 1}
  error: merge tag is disabled

- name: Disabled ordinary duplicate keys still checked
  config: |
    plugin: {merge-key: false}
  yaml: |
    <<: 1
    <<: 2
  error: already defined

- name: Explicit string tag preserves ordinary key
  yaml: |
    !!str <<: {a: 1}
  want: |
    '<<': {a: 1}

- name: Quoted key preserves ordinary key
  yaml: |
    "<<": {a: 1}
  want: |
    '<<': {a: 1}

- name: Explicit short tag merges quoted key
  yaml: |
    !!merge '<<': {a: 1}
  want: |
    a: 1

- name: Explicit long tag merges quoted key
  yaml: |
    !<tag:yaml.org,2002:merge> '<<': {a: 1}
  want: |
    a: 1

- name: Nested merges and aliases
  yaml: |
    base: &base {x: 1}
    item:
      <<: {<<: *base, y: 2}
      x: 3
  want: |
    base: {x: 1}
    item: {x: 3, y: 2}

- name: Invalid merge scalar
  yaml: |
    <<: 3
  error: map merge requires map or sequence of maps

- name: Invalid sequence item
  yaml: |
    <<: [{a: 1}, 3]
  error: map merge requires map or sequence of maps

- name: Alias to sequence is not a merge mapping
  yaml: |
    source: &source [{a: 1}]
    item: {<<: *source}
  error: map merge requires map or sequence of maps

- name: Cyclic merge alias rejected
  yaml: |
    &self {<<: *self}
  error: cyclic merge alias
