# Resolver stage test cases
#
# Purpose: Tests the Resolver's ability to assign default tags and infer types
#
# Test Types:
#   resolve-default - Tests default tag assignment (quoted scalars, collections)
#   resolve-infer - Tests inferring tags from plain scalar values
#   resolve-preserve - Tests that tagged/styled scalars keep their tags
#
# Field Descriptions:
#   name: Human-readable test name
#   node: Input node to resolve
#     kind: Node kind (Scalar, Sequence, Mapping)
#     value: Scalar value
#     tag: Pre-existing tag (for preserve tests)
#     style: Node style (for preserve tests)
#   want: Expected results after resolution
#     tag: Expected tag after resolution

- resolve-default:
    name: Default single quoted scalar to str
    node:
      kind: Scalar
      value: '123'
      style: Single
    want:
      tag: '!!str'

- resolve-default:
    name: Default double quoted scalar to str
    node:
      kind: Scalar
      value: 'hello'
      style: Double
    want:
      tag: '!!str'

- resolve-default:
    name: Default literal scalar to str
    node:
      kind: Scalar
      value: 'line 1\nline 2\n'
      style: Literal
    want:
      tag: '!!str'

- resolve-default:
    name: Default folded scalar to str
    node:
      kind: Scalar
      value: 'line 1 line 2\n'
      style: Folded
    want:
      tag: '!!str'

- resolve-default:
    name: Default sequence to seq
    node:
      kind: Sequence
    want:
      tag: '!!seq'

- resolve-default:
    name: Default mapping to map
    node:
      kind: Mapping
    want:
      tag: '!!map'

- resolve-infer:
    name: Infer int tag from decimal
    node:
      value: '123'
    want:
      tag: '!!int'

- resolve-infer:
    name: Infer int tag from negative
    node:
      value: '-42'
    want:
      tag: '!!int'

- resolve-infer:
    name: Infer int tag from hex
    node:
      value: '0x1A'
    want:
      tag: '!!int'

- resolve-infer:
    name: Infer int tag from octal
    node:
      value: '0o17'
    want:
      tag: '!!int'

- resolve-infer:
    name: Infer float tag from decimal
    node:
      value: '3.14'
    want:
      tag: '!!float'

- resolve-infer:
    name: Infer float tag from positive infinity
    node:
      value: '.inf'
    want:
      tag: '!!float'

- resolve-infer:
    name: Infer float tag from negative infinity
    node:
      value: '-.inf'
    want:
      tag: '!!float'

- resolve-infer:
    name: Infer float tag from NaN
    node:
      value: '.nan'
    want:
      tag: '!!float'

- resolve-infer:
    name: Infer bool tag from true
    node:
      value: 'true'
    want:
      tag: '!!bool'

- resolve-infer:
    name: Infer bool tag from false
    node:
      value: 'false'
    want:
      tag: '!!bool'

- resolve-infer:
    name: Infer bool tag from True
    node:
      value: 'True'
    want:
      tag: '!!bool'

- resolve-infer:
    name: Infer bool tag from FALSE
    node:
      value: 'FALSE'
    want:
      tag: '!!bool'

- resolve-infer:
    name: Infer null tag from null
    node:
      value: 'null'
    want:
      tag: '!!null'

- resolve-infer:
    name: Infer null tag from tilde
    node:
      value: '~'
    want:
      tag: '!!null'

- resolve-infer:
    name: Infer null tag from empty
    node:
      value: ''
    want:
      tag: '!!null'

- resolve-infer:
    name: Infer timestamp tag from date
    node:
      value: '2006-01-02'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag from date only
    node:
      value: '2002-12-14'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag from space separated date and time
    node:
      value: '2001-12-15 02:59:43'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag from space separated date and fractional time
    node:
      value: '2001-12-15 02:59:43.1'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag from uppercase T date and time with UTC zone
    node:
      value: '2001-12-15T02:59:43.1Z'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag from uppercase T date and time with offset
    node:
      value: '2001-12-14T21:59:43.10-05:00'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag from lowercase t date and time with UTC zone
    node:
      value: '2001-12-15t02:59:43.1Z'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag from lowercase t date and time with offset
    node:
      value: '2001-12-14t21:59:43.10-05:00'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag from negative single digit hour offset
    node:
      value: '2001-12-14 21:59:43.10-5'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag from positive single digit hour offset
    node:
      value: '2001-12-14 21:59:43.10+5'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag from positive zero hour offset
    node:
      value: '2001-12-14 21:59:43.10+0'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag from negative zero hour offset
    node:
      value: '2001-12-14 21:59:43.10-0'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag from positive short hour offset with minutes
    node:
      value: '2001-12-14 21:59:43.10+5:30'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag from negative short hour offset with minutes
    node:
      value: '2001-12-14 21:59:43.10-5:30'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag from uppercase T with short hour offset
    node:
      value: '2001-12-14T21:59:43.10+5'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag from lowercase t with short hour offset
    node:
      value: '2001-12-14t21:59:43.10+5'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag from timestamp string with double space separation
    node:
      value: '2001-12-14 21:59:43.10 +5'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag with tab before time zone
    node:
      value: "2001-12-14 21:59:43.10\t+5"
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag from positive two digit hour offset
    node:
      value: '2001-12-14 21:59:43.10+10'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag from negative two digit hour offset
    node:
      value: '2001-12-14 21:59:43.10-10'
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag with tab between date and time without zone
    node:
      value: "2001-12-14\t21:59:43.10"
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag with tab and adjacent hour offset
    node:
      value: "2001-12-14\t21:59:43.10-5"
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag with tab and space before hour offset
    node:
      value: "2001-12-14\t21:59:43.10 +5"
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag with tabs before time and hour offset
    node:
      value: "2001-12-14\t21:59:43.10\t+5"
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag with tab and adjacent offset with minutes
    node:
      value: "2001-12-14\t21:59:43.10-5:30"
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag with tab and space before offset with minutes
    node:
      value: "2001-12-14\t21:59:43.10 +5:30"
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer timestamp tag with tabs before time and offset with minutes
    node:
      value: "2001-12-14\t21:59:43.10\t-5:30"
    want:
      tag: '!!timestamp'

- resolve-infer:
    name: Infer str tag from plain text
    node:
      value: 'hello world'
    want:
      tag: '!!str'

- resolve-infer:
    name: Infer str tag from number-like string
    node:
      value: '123abc'
    want:
      tag: '!!str'

- resolve-preserve:
    name: Preserve explicit str tag
    node:
      value: '123'
      tag: '!!str'
    want:
      tag: '!!str'

- resolve-preserve:
    name: Preserve custom tag
    node:
      value: '123'
      tag: '!custom'
    want:
      tag: '!custom'
