# Node profuse mode tests - comparing -n and -N flags

- name: Plain scalar
  text: |
    hello
  node: |
    plain: hello
  NODE: |
    node: Document
    content:
    - node: Scalar
      style: Plain
      tag: '!!str'
      value: hello

- name: Double quoted scalar
  text: |
    "hello"
  node: |
    double: hello
  NODE: |
    node: Document
    content:
    - node: Scalar
      style: Double
      tag: '!!str'
      value: hello

- name: Integer scalar
  text: |
    42
  node: |
    plain: '42'
  NODE: |
    node: Document
    content:
    - node: Scalar
      style: Plain
      tag: '!!int'
      value: '42'

- name: Explicit tag
  text: |
    !!str 42
  node: |
    plain: '42'
  NODE: |
    node: Document
    content:
    - node: Scalar
      style: Plain
      tag: '!!str'
      value: '42'

- name: Mapping with plain scalars
  text: |
    key: value
  node: |
    mapping:
    - plain: key
    - plain: value
  NODE: |
    node: Document
    content:
    - node: Mapping
      style: Block
      tag: '!!map'
      content:
      - node: Scalar
        style: Plain
        tag: '!!str'
        value: key
      - node: Scalar
        style: Plain
        tag: '!!str'
        value: value

- name: Block mapping with block sequence
  text: |
    foo:
    - bar
  node: |
    mapping:
    - plain: foo
    - sequence:
      - plain: bar
  NODE: |
    node: Document
    content:
    - node: Mapping
      style: Block
      tag: '!!map'
      content:
      - node: Scalar
        style: Plain
        tag: '!!str'
        value: foo
      - node: Sequence
        style: Block
        tag: '!!seq'
        content:
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: bar

- name: Block mapping with flow collections
  text: |
    foo: [{bar: baz}]
  node: |
    mapping:
    - plain: foo
    - sequence:
      - mapping:
        - plain: bar
        - plain: baz
  NODE: |
    node: Document
    content:
    - node: Mapping
      style: Block
      tag: '!!map'
      content:
      - node: Scalar
        style: Plain
        tag: '!!str'
        value: foo
      - node: Sequence
        style: Flow
        tag: '!!seq'
        content:
        - node: Mapping
          style: Flow
          tag: '!!map'
          content:
          - node: Scalar
            style: Plain
            tag: '!!str'
            value: bar
          - node: Scalar
            style: Plain
            tag: '!!str'
            value: baz
