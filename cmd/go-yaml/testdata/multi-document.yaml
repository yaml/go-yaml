    - b
    ---
    - c
    - d
    ---
    - e
    - f
  node: |
    - sequence:
      - plain: a
      - plain: b
    - sequence:
      - plain: c
      - plain: d
    - sequence:
      - plain: e
      - plain: f
  NODE: |
    - node: Document
      content:
      - node: Sequence
        style: Plain
        tag: '!!seq'
        content:
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: a
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: b
    - node: Document
      content:
      - node: Sequence
        style: Plain
        tag: '!!seq'
        content:
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: c
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: d
    - node: Document
      content:
      - node: Sequence
        style: Plain
        tag: '!!seq'
        content:
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: e
        - node: Scalar
          style: Plain
