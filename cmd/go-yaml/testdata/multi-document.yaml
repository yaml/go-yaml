- name: Documents with different scalar styles
  text: |
    plain
    ---
    "double"
    ---
    'single'
  node: |
    - plain: plain
    - double: double
    - single: single
  NODE: |
    - node: Document
      content:
      - node: Scalar
        style: Plain
        tag: '!!str'
        value: plain
    - node: Document
      content:
      - node: Scalar
        style: Double
        tag: '!!str'
        value: double
    - node: Document
      content:
      - node: Scalar
        style: Single
        tag: '!!str'
        value: single

- name: Nested structures across documents
  text: |
    outer:
      inner:
        deep: value1
    ---
    list:
      - nested:
          item: value2
  node: |
    - mapping:
      - plain: outer
      - mapping:
        - plain: inner
        - mapping:
          - plain: deep
          - plain: value1
    - mapping:
      - plain: list
      - sequence:
        - mapping:
          - plain: nested
          - mapping:
            - plain: item
            - plain: value2
  NODE: |
    - node: Document
      content:
      - node: Mapping
        style: Plain
        tag: '!!map'
        content:
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: outer
        - node: Mapping
          style: Plain
          tag: '!!map'
          content:
          - node: Scalar
            style: Plain
            tag: '!!str'
            value: inner
          - node: Mapping
            style: Plain
            tag: '!!map'
            content:
            - node: Scalar
              style: Plain
              tag: '!!str'
              value: deep
            - node: Scalar
              style: Plain
              tag: '!!str'
              value: value1
    - node: Document
      content:
      - node: Mapping
        style: Plain
        tag: '!!map'
        content:
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: list
        - node: Sequence
          style: Plain
          tag: '!!seq'
          content:
          - node: Mapping
            style: Plain
            tag: '!!map'
            content:
            - node: Scalar
              style: Plain
              tag: '!!str'
              value: nested
            - node: Mapping
              style: Plain
              tag: '!!map'
              content:
              - node: Scalar
                style: Plain
                tag: '!!str'
                value: item
              - node: Scalar
                style: Plain
                tag: '!!str'
                value: value2

- name: Documents with full metadata
  text: |
    # head1
    &anchor1 !!str value1 # line1
    # foot1
    ---
    # head2
    &anchor2 !!seq
    - item # line2
    # foot2
    ---
    # head3
    &anchor3 !!map
    key: val # line3
    # foot3
  node: |
    - foot: '# foot1'
      anchor: anchor1
      head: '# head1'
      line: '# line1'
      plain: value1
    - foot: '# foot2'
      anchor: anchor2
      tag: '!!seq'
      sequence:
      - head: '# head2'
        line: '# line2'
        plain: item
    - anchor: anchor3
      tag: '!!map'
      mapping:
      - head: '# head3'
        foot: '# foot3'
        plain: key
      - line: '# line3'
        plain: val
  NODE: |
    - node: Document
      foot: '# foot1'
      content:
      - node: Scalar
        style: Plain
        anchor: anchor1
        tag: '!!str'
        head: '# head1'
        line: '# line1'
        value: value1
    - node: Document
      foot: '# foot2'
      content:
      - node: Sequence
        style: Plain
        anchor: anchor2
        tag: '!!seq'
        content:
        - node: Scalar
          style: Plain
          tag: '!!str'
          head: '# head2'
          line: '# line2'
          value: item
    - node: Document
      content:
      - node: Mapping
        style: Plain
        anchor: anchor3
        tag: '!!map'
        content:
        - node: Scalar
          style: Plain
          tag: '!!str'
          head: '# head3'
          foot: '# foot3'
          value: key
        - node: Scalar
          style: Plain
          tag: '!!str'
          line: '# line3'
          value: val

- name: Documents with integers and special values
  text: |
    42
    ---
    3.14
    ---
    true
    ---
    null
  node: |
    - plain: '42'
    - plain: '3.14'
    - plain: 'true'
    - plain: 'null'
  NODE: |
    - node: Document
      content:
      - node: Scalar
        style: Plain
        tag: '!!int'
        value: '42'
    - node: Document
      content:
      - node: Scalar
        style: Plain
        tag: '!!float'
        value: '3.14'
    - node: Document
      content:
      - node: Scalar
        style: Plain
        tag: '!!bool'
        value: 'true'
    - node: Document
      content:
      - node: Scalar
        style: Plain
        tag: '!!null'
        value: 'null'

- name: Documents with flow style
  text: |
    {key1: value1}
    ---
    [item1, item2]
  node: |
    - mapping:
      - plain: key1
      - plain: value1
    - sequence:
      - plain: item1
      - plain: item2
  NODE: |
    - node: Document
      content:
      - node: Mapping
        style: Flow
        tag: '!!map'
        content:
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: key1
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: value1
    - node: Document
      content:
      - node: Sequence
        style: Flow
        tag: '!!seq'
        content:
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: item1
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: item2

- name: Multiple sequences with explicit markers (no duplicates)
  text: |
    - 1
    ---
    - 2
  explicit-yaml: |
    ---
    - 1
    ...
    ---
    - 2
    ...
