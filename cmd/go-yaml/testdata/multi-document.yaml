# Multi-document tests for -n and -N flags
# Multiple documents should be output as a YAML sequence

- name: Two simple mappings
  text: |
    doc1: value1
    ---
    doc2: value2
  node: |
    - mapping:
      - plain: doc1
      - plain: value1
    - mapping:
      - plain: doc2
      - plain: value2
  NODE: |
    - node: Document
      content:
      - node: Mapping
        style: Plain
        tag: '!!map'
        content:
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: doc1
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: value1
    - node: Document
      content:
      - node: Mapping
        style: Plain
        tag: '!!map'
        content:
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: doc2
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: value2

- name: Three documents with mixed types
  text: |
    scalar1
    ---
    - item1
    - item2
    ---
    key: value
  node: |
    - plain: scalar1
    - sequence:
      - plain: item1
      - plain: item2
    - mapping:
      - plain: key
      - plain: value
  NODE: |
    - node: Document
      content:
      - node: Scalar
        style: Plain
        tag: '!!str'
        value: scalar1
    - node: Document
      content:
      - node: Sequence
        style: Plain
        tag: '!!seq'
        content:
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: item1
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: item2
    - node: Document
      content:
      - node: Mapping
        style: Plain
        tag: '!!map'
        content:
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: key
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: value

- name: Documents with anchors and tags
  text: |
    &anchor1 !!str first
    ---
    &anchor2 !!map
    key: value
  node: |
    - anchor: anchor1
      plain: first
    - anchor: anchor2
      tag: '!!map'
      mapping:
      - plain: key
      - plain: value
  NODE: |
    - node: Document
      content:
      - node: Scalar
        style: Plain
        anchor: anchor1
        tag: '!!str'
        value: first
    - node: Document
      content:
      - node: Mapping
        style: Plain
        anchor: anchor2
        tag: '!!map'
        content:
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: key
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: value

- name: Documents with comments
  text: |
    # comment 1
    doc1: value1
    ---
    # comment 2
    doc2: value2
  node: |
    - mapping:
      - head: '# comment 1'
        plain: doc1
      - plain: value1
    - mapping:
      - head: '# comment 2'
        plain: doc2
      - plain: value2
  NODE: |
    - node: Document
      content:
      - node: Mapping
        style: Plain
        tag: '!!map'
        content:
        - node: Scalar
          style: Plain
          tag: '!!str'
          head: '# comment 1'
          value: doc1
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: value1
    - node: Document
      content:
      - node: Mapping
        style: Plain
        tag: '!!map'
        content:
        - node: Scalar
          style: Plain
          tag: '!!str'
          head: '# comment 2'
          value: doc2
        - node: Scalar
          style: Plain
          tag: '!!str'
          value: value2

