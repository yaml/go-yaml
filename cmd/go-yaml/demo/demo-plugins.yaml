# Demo numbers follow list order; see README.md for usage.
# make contains arguments to make from this repository's root.
# Each distinct build runs once per invocation.
# Executable overrides skip their builds.

# Package paths and pinned versions must remain single shell words.
# yamllint disable rule:line-length
- make: &cli >-
    cli PLUGIN=yaml-parser=reference@v0.2.6
    PLUGIN-PACKAGE=github.com/yamlstar/yamlstar-plugin-parser-json-comments/goyaml@v0.1.1,github.com/yamlstar/yamlstar-plugin-parser-rapidyaml/goyaml@v0.1.4,github.com/yamlstar/yamlstar-plugin-parser-toml/goyaml@v0.1.2
  # yamllint enable rule:line-length
  desc: Parse YAML with the native go-yaml implementation
  cmnd: >-
    <<<$'answer: 42\nitems: [one, two]\n' go-yaml
    --plugin=yaml-parser=go-yaml -J
  impl: go-yaml

- make: *cli
  desc: Parse YAML with the reference parser
  cmnd: >-
    <<<$'answer: 42\nitems: [one, two]\n' go-yaml
    --plugin=yaml-parser=reference -J
  impl: reference

- make: *cli
  desc: Parse JSON-style comments with the JSON-comments parser
  cmnd: >-
    <<<$'{answer: true/* JSON block comment */} // line comment\n'
    go-yaml --plugin=yaml-parser=json-comments -J
  impl: json-comments

- make: *cli
  desc: Parse YAML with the RapidYAML shared-library adapter
  cmnd: >-
    <<<$'answer: 42\nitems: [one, two]\n' go-yaml
    --plugin=yaml-parser=rapidyaml -J
  impl: rapidyaml

- make: *cli
  desc: Parse TOML with the external TOML adapter
  cmnd: >-
    <<<$'answer = 42\n[server]\nhost = "localhost"\n' go-yaml
    --plugin=yaml-parser=toml -J
  impl: toml

- make: *cli
  desc: Load tab-indented YAML with tab-indent
  cmnd: >-
    <<<$'root:\n\tanswer: 42\n' go-yaml
    --plugin=yaml-parser=go-yaml\,tab-indent -J
  impl: go-yaml

- make: *cli
  desc: Dump YAML using tabs with tab-indent
  cmnd: >-
    <<<$'root:\n  answer: 42\n' go-yaml
    --plugin=yaml-parser=go-yaml\,tab-indent -y
  impl: go-yaml

- make: *cli
  desc: Reject excessive nesting with loader-limits
  cmnd: >-
    <<<$'[[[0]]]\n' go-yaml
    -C <(echo '{plugin: {loader-limits: {depth: 2}}}') -J
  fail: depth

- make: *cli
  desc: Reject alias expansion with loader-limits
  cmnd: >-
    <<<$'[&value 42, *value]\n' go-yaml
    -C <(echo '{plugin: {loader-limits: {alias: 0}}}') -J
  fail: alias

- make: *cli
  desc: Show a parse error using the v3 error formatter
  cmnd: >-
    <<<$'answer: [1, 2\n' go-yaml -C <(echo '{plugin: {error-format: v3}}') -J
  fail: 'yaml: line'

- make: *cli
  desc: Show a parse error using the v4 error formatter
  cmnd: >-
    <<<$'answer: [1, 2\n' go-yaml
    -C <(echo '{plugin: {error-format: {v4: {position: long}}}}') -J
  fail: at line

- make: *cli
  desc: Customize the v4 error template
  cmnd: >-
    <<<$'answer: [1, 2\n' go-yaml -C <(echo
    '{plugin: {error-format: {v4: {load-template: "DEMO: {{.Message}}"}}}}') -J
  fail: 'DEMO:'

- make: *cli
  desc: Disable YAML merge keys
  cmnd: >-
    <<<$'<<: {a: 1}\n' go-yaml
    -C <(echo '{plugin: {merge-key: {disable: true}}}') -J
  impl: merge-key

- make: *cli
  desc: Combine repeated merge directives
  cmnd: >-
    <<<$'<<: {x: 1, a: 1}\n<<: {x: 2, b: 2}\n' go-yaml
    -C <(echo '{plugin: {merge-key: {multiple: combine}}}') -J
  impl: merge-key

- make: *cli
  desc: Let the last merge source win
  cmnd: >-
    <<<$'<<: {x: 1, a: 1}\n<<: {x: 2, b: 2}\n' go-yaml
    -C <(echo '{plugin: {merge-key: {multiple: combine, conflicts: last}}}') -J
  impl: merge-key

- make: *cli
  desc: Supply an external anchor through inline Alias-Data
  cmnd: >-
    <<<$'item: *defaults\n' go-yaml
    -C <(echo '{plugin: {alias-data: {data: {defaults: {color: blue, size: 3}}}}}') -J
  impl: alias-data

- make: *cli
  desc: Resolve an alias from a selected environment variable
  cmnd: >-
    <<<$'color: *PLUGIN_DEMO_COLOR\n' env PLUGIN_DEMO_COLOR=blue go-yaml
    -C <(echo '{plugin: {alias-data: {env: PLUGIN_DEMO_COLOR}}}') -J
  impl: alias-data

- make: *cli
  desc: Resolve an alias from an Alias-Data file
  cmnd: >-
    alias_file=$(mktemp) && trap 'rm -f "$alias_file"' EXIT &&
    printf %s $'defaults: {color: blue, size: 3}\n' > "$alias_file" &&
    <<<$'item: *defaults\n' go-yaml
    -C <(printf 'plugin: {alias-data: {file: "%s"}}\n' "$alias_file") -J
  impl: alias-data

- make: *cli
  desc: Reuse an anchor across documents with Alias-Data
  cmnd: >-
    <<<$'--- &defaults {color: blue}\n---\nitem: *defaults\n' go-yaml
    --plugin=alias-data -J
  impl: alias-data

- make: *cli
  desc: Keep ordinary aliases while disabling cross-document reuse
  cmnd: >-
    <<<$'local: &value 42\ncopy: *value\n' go-yaml
    -C <(echo '{plugin: {alias-data: {stream: false}}}') -J
  impl: alias-data

- make: *cli
  desc: Reject cross-document aliases with document scope
  cmnd: >-
    <<<$'--- &saved {value: 42}\n---\ncopy: *saved\n' go-yaml
    -C <(echo '{plugin: {alias-data: {stream: false}}}') -J
  fail: unknown anchor

- make: *cli
  desc: Reject aliases altogether with Alias-Data disable
  cmnd: >-
    <<<$'local: &value 42\ncopy: *value\n' go-yaml
    -C <(echo '{plugin: {alias-data: {disable: true}}}') -J
  fail: aliases are disabled

- make: *cli
  desc: Select a nested mapping value through a dotted anchor path
  cmnd: >-
    <<<$'settings: &x1 {foo: {bar: 42}}\nanswer: *x1.foo.bar\n' go-yaml
    -C <(echo '{plugin: {alias-data: {path: true}}}') -J
  impl: alias-data

- make: *cli
  desc: Select a sequence item and its mapping value through an anchor path
  cmnd: >-
    <<<$'items: &x2 [zero, one, two, {baz: found}]\nselected: *x2.3.baz\n' go-yaml
    -C <(echo '{plugin: {alias-data: {path: true}}}') -J
  impl: alias-data

- make: *cli
  desc: Reuse a dotted anchor path across documents automatically
  cmnd: >-
    <<<$'--- &saved {foo: {bar: 42}}\n---\ncopy: *saved.foo.bar\n' go-yaml
    -C <(echo '{plugin: {alias-data: {path: true}}}') -J
  impl: alias-data

- make: *cli
  desc: Keep dotted anchor paths within each document explicitly
  cmnd: >-
    <<<$'--- &saved {foo: 42}\n---\ncopy: *saved.foo\n' go-yaml
    -C <(echo '{plugin: {alias-data: {path: true, stream: false}}}') -J
  fail: unknown anchor

- make: *cli
  desc: Report the failing segment in a missing anchor path
  cmnd: >-
    <<<$'settings: &saved {foo: 42}\ncopy: *saved.missing\n' go-yaml
    -C <(echo '{plugin: {alias-data: {path: true}}}') -J
  fail: missing mapping key

- make: *cli
  desc: Select a numeric string mapping key using single quotes
  cmnd: >-
    <<<$'settings: &foo {\'42\': {bar: found}, \'042\': leading}\nselected: *foo.\'42\'.bar\nleading: *foo.\'042\'\n' go-yaml
    -C <(echo '{plugin: {alias-data: {path: true}}}') -J
  impl: alias-data

- make: *cli
  desc: Reject a sequence index with a leading zero
  cmnd: >-
    <<<$'items: &foo [zero, one]\nselected: *foo.01\n' go-yaml
    -C <(echo '{plugin: {alias-data: {path: true}}}') -J
  fail: sequence index must not have leading zeros
